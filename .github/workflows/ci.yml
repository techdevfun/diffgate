name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p tsconfig.check.json
      - run: npm test
      - name: dogfood -- gate this diff with diffgate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE=$(git rev-parse HEAD~1)
          else
            BASE=""
          fi
          if [ -n "$BASE" ]; then
            node dist/cli.js check --base "$BASE" --format github
          else
            echo "diffgate: single-commit history, nothing to gate"
          fi
