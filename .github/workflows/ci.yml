name: ci

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc -p tsconfig.check.json
      - run: npm test
      - name: dogfood -- gate this diff with diffgate
        # PRs only: a fresh repo's first pushes diff the whole codebase,
        # where boilerplate duplication is expected, not a failure.
        if: github.event_name == 'pull_request'
        run: |
          BASE=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          node dist/cli.js check --base "$BASE" --format github
